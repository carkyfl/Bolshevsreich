l_english:
 BR_GER_constitutional_order:0 "The Imperial Settlement"
 BR_GER_constitutional_order_desc:0 "The Kaiserreich's constitutional order binds imperial authority to a liberal, market-oriented political settlement."
 BR_GER_mitteleuropa_market:0 "The Mitteleuropa Market"
 BR_GER_mitteleuropa_market_desc:0 "Lower barriers and shared standards will deepen Germany's economic leadership across the continent."
 BR_GER_imperial_compromise:0 "Crown and Parliament"
 BR_GER_imperial_compromise_desc:0 "A durable compromise between the crown, parliament and the commercial classes can secure the Reich."
 BR_GER_general_staff:0 "Reform the General Staff"
 BR_GER_general_staff_desc:0 "The army must adapt its plans to a world in which Germany's rivals seek a chance to revise the peace."
 BR_AUS_confederation:0 "The Danubian Confederation"
 BR_AUS_confederation_desc:0 "The successor states of the Habsburg lands require a common framework without erasing their distinct institutions."
 BR_AUS_vienna_compromise:0 "The Vienna Compromise"
 BR_AUS_vienna_compromise_desc:0 "Vienna will mediate between the confederation's national governments."
 BR_AUS_common_market:0 "A Common Danubian Market"
 BR_AUS_common_market_desc:0 "Customs cooperation can make the confederation prosperous and interdependent."
 BR_AUS_alpine_defence:0 "Alpine Defence Plan"
 BR_AUS_alpine_defence_desc:0 "Coordinate the mountain defences and staff planning of the confederation."
 BR_HUN_national_accord:0 "The National Accord"
 BR_HUN_national_accord_desc:0 "Hungary seeks influence within the confederation while keeping its own parliament and administration."
 BR_HUN_danube_industry:0 "Danube Industrial Works"
 BR_HUN_danube_industry_desc:0 "Investment in transport and manufacturing will strengthen Hungary's place in the Danubian economy."
 BR_HUN_crown_and_parliament:0 "Crown and Parliament"
 BR_HUN_crown_and_parliament_desc:0 "A constitutional settlement can reconcile tradition with a representative government."
 BR_HUN_frontier_army:0 "Modernise the Frontier Army"
 BR_HUN_frontier_army_desc:0 "Improve the organisation of Hungary's defence forces."
 BR_ILI_adriatic_council:0 "The Adriatic Council"
 BR_ILI_adriatic_council_desc:0 "A shared council can give Iliria a voice in the confederation and across the Adriatic."
 BR_ILI_adriatic_ports:0 "Develop the Adriatic Ports"
 BR_ILI_adriatic_ports_desc:0 "Modern ports will connect Ilirian trade with the wider Mitteleuropa market."
 BR_ILI_federal_charter:0 "The Federal Charter"
 BR_ILI_federal_charter_desc:0 "Guarantee local representation within a workable federal constitution."
 BR_ILI_coastal_guard:0 "An Adriatic Coastal Guard"
 BR_ILI_coastal_guard_desc:0 "Protect maritime commerce and the confederation's coastline."
 BR_BOH_bohemian_charter:0 "The Bohemian Charter"
 BR_BOH_bohemian_charter_desc:0 "Secure Bohemian representation and civil administration within the confederation."
 BR_BOH_skoda_works:0 "Expand the Škoda Works"
 BR_BOH_skoda_works_desc:0 "Bohemia's engineers and workshops can serve both civilian production and continental industry."
 BR_BOH_prague_university:0 "The Prague Academic Network"
 BR_BOH_prague_university_desc:0 "Support technical education and research in the historic university city."
 BR_BOH_mountain_defence:0 "Bohemian Border Defences"
 BR_BOH_mountain_defence_desc:0 "Prepare the borderlands to deter any attempt to overturn the settlement."
 BR_GAL_galician_diet:0 "The Galician Diet"
 BR_GAL_galician_diet_desc:0 "A representative diet can balance provincial interests within the confederation."
 BR_GAL_grain_exports:0 "Galician Grain Exports"
 BR_GAL_grain_exports_desc:0 "Improve the routes that carry the region's agricultural output to market."
 BR_GAL_local_autonomy:0 "Provincial Autonomy"
 BR_GAL_local_autonomy_desc:0 "Local institutions must have the authority to address local needs."
 BR_GAL_eastern_frontier:0 "Guard the Eastern Frontier"
 BR_GAL_eastern_frontier_desc:0 "Coordinate border security with the other confederate governments."
 BR_BDU_baltic_administration:0 "The Baltic Administration"
 BR_BDU_baltic_administration_desc:0 "The duchy's limited territory must be governed carefully under German protection."
 BR_BDU_klaipeda_harbour:0 "Klaipėda Harbour"
 BR_BDU_klaipeda_harbour_desc:0 "Develop the port and trade links of the Baltic coast."
 BR_BDU_ducal_compromise:0 "A Ducal-Lithuanian Compromise"
 BR_BDU_ducal_compromise_desc:0 "Reconcile the duchy's institutions with the population it governs."
 BR_BDU_german_guarantee:0 "Renew the German Guarantee"
 BR_BDU_german_guarantee_desc:0 "The duchy's security rests on its relationship with Berlin."
 BR_CAT_republican_cortes:0 "The Republican Cortes"
 BR_CAT_republican_cortes_desc:0 "Catalonia's young democracy must create institutions trusted across its divided political landscape."
 BR_CAT_barcelona_industry:0 "Barcelona's Industrial Belt"
 BR_CAT_barcelona_industry_desc:0 "Expand Catalonia's manufacturing base and protect the jobs on which the republic depends."
 BR_CAT_autonomy_compromise:0 "A Social and Regional Compromise"
 BR_CAT_autonomy_compromise_desc:0 "A broad compromise can keep the fragile republic from breaking apart."
 BR_CAT_militia_reform:0 "Reorganise the National Militia"
 BR_CAT_militia_reform_desc:0 "Build a disciplined defence force answerable to the republic."
 BR_FIN_red_councils:0 "The Workers' Councils"
 BR_FIN_red_councils_desc:0 "Finland's socialist government will organise its institutions around workers' councils."
 BR_FIN_timber_and_paper:0 "Timber and Paper Industry"
 BR_FIN_timber_and_paper_desc:0 "Develop the country's forest industries and the transport links they require."
 BR_FIN_soviet_trade:0 "The Soviet Trade Protocol"
 BR_FIN_soviet_trade_desc:0 "Closer trade ties with Moscow bring security and economic dependence in equal measure."
 BR_FIN_northern_defence:0 "Defend the Northern Approach"
 BR_FIN_northern_defence_desc:0 "Prepare for the severe conditions of a northern campaign."
 BR_MAF_colonial_office:0 "The Colonial Office in Dar es Salaam"
 BR_MAF_colonial_office_desc:0 "The colonial administration seeks to coordinate Germany's vast African holdings."
 BR_MAF_railway_network:0 "Continental Railway Survey"
 BR_MAF_railway_network_desc:0 "Rail links are planned to connect ports, administrative centres and resource regions."
 BR_MAF_local_auxiliaries:0 "Colonial Auxiliary Forces"
 BR_MAF_local_auxiliaries_desc:0 "Recruit and organise auxiliary units to support the colonial garrisons."
 BR_MAF_settler_administration:0 "Reorganise the Administration"
 BR_MAF_settler_administration_desc:0 "A more efficient civil service can better manage the colony's disparate territories."
 BR_BUL_sofia_cabinet:0 "The Sofia Cabinet"
 BR_BUL_sofia_cabinet_desc:0 "Bulgaria balances its alliance commitments with its own ambitions in the Balkans."
 BR_BUL_black_sea_trade:0 "Black Sea Trade Links"
 BR_BUL_black_sea_trade_desc:0 "Expand commercial access to the Black Sea and the wider Central Powers market."
 BR_BUL_balkan_guarantees:0 "Balkan Guarantees"
 BR_BUL_balkan_guarantees_desc:0 "Diplomatic guarantees can preserve Bulgaria's position without provoking another regional war."
 BR_BUL_army_modernisation:0 "Modernise the Bulgarian Army"
 BR_BUL_army_modernisation_desc:0 "Update doctrine and organisation for a new generation of warfare."
 BR_TUR_imperial_council:0 "The Imperial Council"
 BR_TUR_imperial_council_desc:0 "The Ottoman state must coordinate its many provinces while preserving imperial authority."
 BR_TUR_anatolian_works:0 "Anatolian Development Works"
 BR_TUR_anatolian_works_desc:0 "Investment in Anatolia will improve the empire's economic and transport foundations."
 BR_TUR_arab_provinces_compact:0 "Compact with the Arab Provinces"
 BR_TUR_arab_provinces_compact_desc:0 "A durable imperial settlement requires provincial participation and dependable local administration."
 BR_TUR_straits_command:0 "Command of the Straits"
 BR_TUR_straits_command_desc:0 "The Bosporus and Dardanelles remain central to imperial security."
 BR_SOV_permanent_revolution:0 "Permanent Revolution"
 BR_SOV_permanent_revolution_desc:0 "Trotsky's government looks beyond the Soviet borders while consolidating the revolution at home."
 BR_SOV_five_year_reconstruction:0 "Reconstruction Plan"
 BR_SOV_five_year_reconstruction_desc:0 "Rebuild industry and infrastructure after the upheavals of the revolutionary period."
 BR_SOV_workers_councils:0 "Renew the Workers' Councils"
 BR_SOV_workers_councils_desc:0 "Reassert the political role of the soviets in the revolutionary state."
 BR_SOV_red_army_reform:0 "Reform the Red Army"
 BR_SOV_red_army_reform_desc:0 "A modern army is essential to defend the revolution and support its allies."
 BR_FRA_republic_in_crisis:0 "The Republic Under Pressure"
 BR_FRA_republic_in_crisis_desc:0 "France remains a great power, but defeat has left its politics and society under strain."
 BR_FRA_industrial_recovery:0 "Industrial Recovery"
 BR_FRA_industrial_recovery_desc:0 "Rebuild the productive base needed to regain France's independence."
 BR_FRA_unity_government:0 "A Government of National Unity"
 BR_FRA_unity_government_desc:0 "Only cooperation across the political divide can preserve the republic."
 BR_FRA_rearmament:0 "Rearm the Republic"
 BR_FRA_rearmament_desc:0 "France must be able to defend itself against a dominant Germany."
 BR_ENG_parliamentary_consensus:0 "Westminster Consensus"
 BR_ENG_parliamentary_consensus_desc:0 "Parliament seeks a common policy for a Britain whose influence has diminished but not disappeared."
 BR_ENG_commonwealth_markets:0 "Commonwealth Markets"
 BR_ENG_commonwealth_markets_desc:0 "Strengthen trade ties throughout the Commonwealth and the wider empire."
 BR_ENG_imperial_conference:0 "Imperial Conference"
 BR_ENG_imperial_conference_desc:0 "Consultation with the dominions can renew Britain's international reach."
 BR_ENG_home_fleet:0 "Rebuild the Home Fleet"
 BR_ENG_home_fleet_desc:0 "The Royal Navy remains essential to Britain's security and status."
 BR_CHI_northeastern_leadership:0 "Zhang Xueliang's Leadership"
 BR_CHI_northeastern_leadership_desc:0 "The Young Marshal has emerged as the figure capable of bringing China's fractured politics together."
 BR_CHI_reunify_the_republic:0 "Reunify the Republic"
 BR_CHI_reunify_the_republic_desc:0 "Bring the regional administrations under a single government in Nanjing, ending the age of warlord division."
 BR_CHI_national_reconstruction:0 "National Reconstruction"
 BR_CHI_national_reconstruction_desc:0 "A unified republic must restore transport, industry and public confidence."
 BR_CHI_new_manchurian_army:0 "The New Northeastern Army"
 BR_CHI_new_manchurian_army_desc:0 "Zhang's forces will form the core of a modern national army."
 bolshevsreich.10.t:0 "The Republic Reunited"
 bolshevsreich.10.d:0 "With the regional armies brought under the national government, Zhang Xueliang proclaims the reunification of China."
 bolshevsreich.10.a:0 "One China, one government"
